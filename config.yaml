# Scenario: the docker lab under testing/ — one Icinga master container
# (reachable from the host over the lab_edge network) driving five monitored
# clients that only live on the lab_internal network.
mode: deploy

protocol: ssh
user: root
repo: https://github.com/galizaragoza/arsenal.git
dir: /test/testdir

master:
  ip: 172.21.0.10
  name: master.lab
  creds: ./testing/keys/id_ed25519
  method: rsync
  subjects:
    - ip: 172.20.0.11
      name: slave1.lab
    - ip: 172.20.0.12
      name: slave2.lab
    - ip: 172.20.0.13
      name: slave3.lab
    - ip: 172.20.0.14
      name: slave4.lab
    - ip: 172.20.0.15
      name: slave5.lab
